name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: l00tcast-linux-x64
          path: target/release/l00tcast

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SMB client and john
        run: sudo apt-get update && sudo apt-get install -y smbclient john
      - name: Build
        run: cargo build --release
      - name: SMB NetNTLM capture + crack e2e
        run: ./tests/smb.sh
